version: '3.8'

services:
  # PHP + Apache Web 服务
  web:
    build: .
    ports:
      - "9527:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - MYSQL_ROOT_PASSWORD=123456

  # MySQL 数据库服务
  db:
    image: mysql:5.7
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mycms
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: